<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Aura</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Missão Aura</h1>
            <p>Veja qual perfil combina com você.</p>
        </header>

        <section id="formulario" class="card">
            <h2>Vamos começar?</h2>

            <form id="form-missao">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" required>

                <fieldset class="pergunta">
                    <legend>1. A nave apresenta um problema. O que você faz?</legend>
                    <label><input type="radio" name="q1" value="1"> Procuro a falha e tento consertar.</label>
                    <label><input type="radio" name="q1" value="2"> Analiso as informações.</label>
                    <label><input type="radio" name="q1" value="3"> Exploro o local.</label>
                    <label><input type="radio" name="q1" value="4"> Organizo a equipe.</label>
                </fieldset>

                <fieldset class="pergunta">
                    <legend>2. Onde você gostaria de trabalhar?</legend>
                    <label><input type="radio" name="q2" value="1"> Em uma oficina tecnológica.</label>
                    <label><input type="radio" name="q2" value="2"> Em um laboratório.</label>
                    <label><input type="radio" name="q2" value="3"> Em um planeta desconhecido.</label>
                    <label><input type="radio" name="q2" value="4"> No centro de comando.</label>
                </fieldset>

                <fieldset class="pergunta">
                    <legend>3. Qual característica combina mais com você?</legend>
                    <label><input type="radio" name="q3" value="1"> Sou bom em resolver problemas.</label>
                    <label><input type="radio" name="q3" value="2"> Sou curioso e observador.</label>
                    <label><input type="radio" name="q3" value="3"> Gosto de aventuras.</label>
                    <label><input type="radio" name="q3" value="4"> Gosto de planejar.</label>
                </fieldset>

                <fieldset class="pergunta">
                    <legend>4. Qual missão você escolheria?</legend>
                    <label><input type="radio" name="q4" value="1"> Criar uma nova tecnologia.</label>
                    <label><input type="radio" name="q4" value="2"> Fazer uma descoberta científica.</label>
                    <label><input type="radio" name="q4" value="3"> Explorar novos lugares.</label>
                    <label><input type="radio" name="q4" value="4"> Liderar uma equipe.</label>
                </fieldset>

                <p id="mensagem" role="alert"></p>
                <button type="submit">Descobrir meu perfil</button>
            </form>
        </section>

        <section id="resultado" class="card" hidden>
            <h2 id="saudacao"></h2>
            <p id="idade"></p>
            <img id="imagem-perfil" alt="Imagem do perfil">
            <h2 id="nome-perfil"></h2>
            <p id="categoria-perfil"></p>
            <p id="descricao-perfil"></p>
            <p id="pontuacao"></p>
            <button type="button" id="refazer">Fazer o teste novamente</button>
        </section>
    </main>
</body>
</html>
